{{ define "main" }}
{{ $pages := sort .Pages "Date" "desc" }}

<main class="mx-auto w-full max-w-5xl px-6 py-10 md:px-12">
  <header class="mb-12">
    <p class="mb-3 text-sm font-semibold text-primary-600 dark:text-primary-400">分类</p>
    <h1 class="text-4xl font-bold tracking-tight text-slate-900 dark:text-slate-100">{{ .Title }}</h1>
    <p class="mt-3 text-slate-600 dark:text-slate-300">{{ len $pages }} 篇文章</p>
  </header>

  <ol class="space-y-5">
    {{ range $pages }}
      <li class="rounded-2xl border border-slate-200 bg-white/90 p-6 shadow-sm transition hover:border-primary-300 hover:shadow-md dark:border-slate-800 dark:bg-zinc-900/90 dark:hover:border-primary-700">
        <div class="flex flex-col gap-3 md:flex-row md:items-start md:justify-between">
          <div class="min-w-0">
            <h2 class="text-2xl font-semibold text-slate-900 dark:text-slate-100">
              <a class="hover:text-primary-600 dark:hover:text-primary-400" href="{{ .RelPermalink }}">{{ .Title }}</a>
            </h2>
            {{ with .Summary }}
              <p class="mt-3 line-clamp-2 text-slate-600 dark:text-slate-300">{{ . | plainify | htmlUnescape }}</p>
            {{ end }}
          </div>
          <time class="shrink-0 text-sm text-slate-500 dark:text-slate-400" datetime="{{ .Date.Format "2006-01-02" }}">
            {{ .Date.Format "2006-01-02" }}
          </time>
        </div>
      </li>
    {{ end }}
  </ol>
</main>
{{ end }}
