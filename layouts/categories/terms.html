{{ define "main" }}
<main class="mx-auto w-full max-w-5xl px-6 py-10 md:px-12" data-pagefind-ignore>
  <header class="mb-12">
    <h1 class="text-4xl font-bold tracking-tight text-slate-900 dark:text-slate-100">分类</h1>
    <p class="mt-3 text-slate-600 dark:text-slate-300">按主题浏览文章。</p>
  </header>

  <div class="grid gap-5 md:grid-cols-2 lg:grid-cols-3">
    {{ range .Data.Terms.ByCount }}
      {{ $term := .Page }}
      {{ if and $term .Name }}
        <a href="{{ $term.RelPermalink }}" class="group rounded-2xl border border-slate-200 bg-white/90 p-6 shadow-sm transition hover:-translate-y-1 hover:border-primary-300 hover:shadow-lg dark:border-slate-800 dark:bg-zinc-900/90 dark:hover:border-primary-700">
          <div class="flex items-center justify-between gap-4">
            <h2 class="text-xl font-semibold text-slate-900 group-hover:text-primary-600 dark:text-slate-100 dark:group-hover:text-primary-400">
              {{ $term.Title }}
            </h2>
            <span class="rounded-full bg-primary-100 px-3 py-1 text-sm font-semibold text-primary-800 dark:bg-primary-900/40 dark:text-primary-300">
              {{ .Count }}
            </span>
          </div>
        </a>
      {{ end }}
    {{ end }}
  </div>
</main>
{{ end }}
