mainSections = ["post"]
rssFullContent = true
favicon = "img/SSicon.png"

[hugoblox]
schema = "2.0"

[hugoblox.identity]
name = "Somnus"
organization = ""
type = "person"
tagline = "我可以告诉你当年我也和你一样郁闷吗"
description = "Somnus 的个人博客，记录学习、项目、实验和日常。"

[hugoblox.identity.social]
twitter = ""

[hugoblox.theme]
mode = "system"
pack = "default"

[hugoblox.theme.colors]
primary = "#4f46e5"
secondary = ""
neutral = ""

[hugoblox.typography]
pack = "academic"

[hugoblox.layout]
radius = "md"
spacing = "comfortable"
avatar_shape = "circle"

[hugoblox.header]
enable = true
style = "navbar"
sticky = true
align = "center"
search = true
theme_toggle = true
theme_picker = false
language_switcher = false

[hugoblox.header.cta]
enable = false
text = ""
url = ""

[hugoblox.footer]
style = "minimal"
language_switcher = false
text = ""

[hugoblox.copyright]
notice = "© {year} {name}. This work is licensed under {license}"

[hugoblox.copyright.license]
type = "cc"
allow_derivatives = true
share_alike = true
allow_commercial = false

[hugoblox.content.math]
enable = false

[hugoblox.content.toc]
enable = true

[hugoblox.content.reading_time]
enable = true

[hugoblox.content.citations]
style = "apa"

[hugoblox.search]
enable = true
suggestions = ["LLM", "Rust", "服务器基础", "日记"]
