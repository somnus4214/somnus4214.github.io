<!doctype html>
<html lang="{{ config.extra.html_lang | default(value='zh-CN') }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    <link rel="icon" href="{{ get_url(path='img/favicon.png') }}">
    <link rel="alternate" type="application/atom+xml" title="{{ config.title }} Atom" href="{{ get_url(path='atom.xml', trailing_slash=false) }}">
    <link rel="alternate" type="application/rss+xml" title="{{ config.title }} RSS" href="{{ get_url(path='rss.xml', trailing_slash=false) }}">
    <link rel="stylesheet" href="{{ get_url(path='css/somnus-zola.css') }}">
    <script>
      (() => {
        const stored = localStorage.getItem("somnus-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = stored || (prefersDark ? "dark" : "light");
      })();
    </script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]],
          tags: "ams"
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"]
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    {% block head %}{% endblock head %}
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ get_url(path='/') }}">
        <img src="{{ get_url(path='img/SSicon.png') }}" alt="" width="32" height="32">
        <span>{{ config.title }}</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        {% for item in config.extra.nav %}
          <a href="{{ item.url }}">{{ item.name }}</a>
        {% endfor %}
      </nav>
      <button class="theme-toggle" type="button" aria-label="切换明暗主题">☾</button>
    </header>

    <main class="site-main">
      {% block content %}{% endblock content %}
    </main>

    <footer class="site-footer">
      <span>{{ config.extra.copyright }}</span>
      <span><a href="{{ config.extra.github }}">GitHub</a></span>
      <span><a href="{{ config.extra.email }}">Email</a></span>
    </footer>

    <button class="scroll-top" type="button" aria-label="回到顶部">↑</button>
    <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script defer src="{{ get_url(path='js/somnus-zola.js') }}"></script>
    {% block scripts %}{% endblock scripts %}
  </body>
</html>
