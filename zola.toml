base_url = "https://blog.somnus.top"
title = "Somnus的博客"
description = "Somnus 的个人博客，记录学习、项目、实验和日常。"
theme = "apollo"
default_language = "en"
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml", "rss.xml"]
author = "Somnus"
minify_html = true

taxonomies = [
  { name = "categories", feed = true },
  { name = "tags", feed = true },
  { name = "authors", feed = true },
  { name = "series", feed = true },
]

[markdown]
render_emoji = true
external_links_target_blank = true
external_links_no_referrer = true
smart_punctuation = true
definition_list = true

[markdown.highlighting]
theme = "github-light"

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"

[extra]
copyright = "© 2026 Somnus"
author = "Somnus"
bio = "记录学习、项目、实验和日常。偏爱把折腾过的东西写下来。"
avatar = "/img/avatar.webp"
github = "https://github.com/somnus0917"
email = "mailto:mailmeblog@somnus.wiki"
html_lang = "zh-CN"
toc = true
use_cdn = false
favicon = "/img/favicon.png"
theme = "toggle-auto"
fancy_code = true
dynamic_note = true
mermaid = true
mathjax = false
word_count = false
stylesheets = ["css/apollo-overrides.css"]

menu = [
  { name = "文章", url = "/posts", weight = 1 },
  { name = "笔记", url = "/notes", weight = 2 },
  { name = "公式", url = "/latex", weight = 3 },
  { name = "日记", url = "/diary", weight = 4 },
  { name = "分类", url = "/categories", weight = 5 },
  { name = "标签", url = "/tags", weight = 6 },
]

socials = [
  { name = "GitHub", url = "https://github.com/somnus0917", icon = "github" },
  { name = "Email", url = "mailto:mailmeblog@somnus.wiki", icon = "email" },
  { name = "RSS", url = "/rss.xml", icon = "rss" },
]

fediverse = false
fediverse_creator = ""

[extra.taxonomies]
sort_by = "page_count"
reverse = true

[extra.analytics]
enabled = false

[extra.analytics.goatcounter]
user = ""
host = "goatcounter.com"

[extra.analytics.umami]
website_id = ""
host_url = "https://api-gateway.umami.dev/"

[extra.analytics.google]
tracking_id = ""
